[project]
name = "llm-config-mcp"
version = "1.0.0"
description = "AI 客户端配置生成 MCP：一次生成 18 种客户端的接入配置"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
llm-config-mcp = "llm_config_mcp:main"

[project.urls]
Homepage = "https://github.com/dafeiai918/llm-config-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["llm_config_mcp.py"]
